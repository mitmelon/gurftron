[package]
name = "manomite-loader"
version = "0.1.0"
edition = "2021"
description = "One Rust binary that loads local GGUF and ONNX models behind a single HTTP API"
license = "MIT"

[features]
default = ["gguf", "onnx"]
# GGUF generation through llama.cpp (needs cmake + a C++ toolchain + libclang to build)
gguf = ["dep:llama-cpp-2"]
# ONNX embedding / classifier models through ONNX Runtime
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
